<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneWiseAll | AI Music Finder & Engine</title>
    <style>
        :root {
            --bg: #090b10;
            --surface: #121620;
            --surface-card: #1a202c;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2e3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: rgba(18, 22, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 18px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title span {
            color: var(--accent);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .hero-section {
            background: linear-gradient(135deg, var(--surface) 0%, #0d1117 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .hero-section h1 {
            font-size: 32px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .listen-btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .listen-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--primary-glow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .listen-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px var(--accent-glow);
        }

        .listen-btn.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ef4444, #f97316);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 50px rgba(239, 68, 68, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        }

        .ai-voice-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .ai-input {
            flex: 1;
            background: #090b10;
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .ai-input:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-accent { background: var(--accent); color: white; }

        .player-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            display: none;
            margin-top: 20px;
        }

        .player-layout {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .track-cover {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
        }

        .track-info { flex: 1; }
        .track-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .track-artist { color: var(--text-muted); font-size: 15px; margin-bottom: 12px; }

        .player-iframe {
            width: 100%;
            height: 180px;
            border: none;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-badge">TW</span>
            <div class="brand-title">Tune<span>WiseAll</span></div>
        </div>
        <div style="font-size: 13px; color: var(--text-muted);">
            Micro WebLab AI Connected
        </div>
    </header>

    <div class="container">
        <!-- Prepoznavanje iz okoline (Shazam stil) -->
        <div class="hero-section">
            <h1>Prepoznaj ili Pronađi Glazbu</h1>
            <p>Pritisni gumb za slušanje pjesme iz okoline ili pošalji glasovnu poruku AI asistentu.</p>

            <div class="listen-btn-wrapper">
                <button class="listen-btn" id="listenBtn" onclick="toggleListening()">🎵</button>
            </div>
            <div id="statusText" style="font-size: 14px; color: var(--text-muted);">Klikni za početak prepoznavanja</div>
        </div>

        <!-- AI Glasovna / Tekstualna pretraga preko Micro WebLaba -->
        <div class="ai-voice-box">
            <input type="text" id="aiQuery" class="ai-input" placeholder="Npr. Pronađi pjesmu sa stihovima 'We are the champions'...">
            <button class="btn btn-accent" onclick="sendToMicroWebLab()">🎙️ Glasovni AI</button>
            <button class="btn btn-primary" onclick="searchMusic()">🔍 Traži</button>
        </div>

        <!-- Player i Prikaz Pjesme (Spotify stil) -->
        <div class="player-card" id="playerCard">
            <div class="player-layout">
                <img id="trackImg" class="track-cover" src="" alt="Cover">
                <div class="track-info">
                    <div class="track-title" id="trackTitle">Naziv Pjesme</div>
                    <div class="track-artist" id="trackArtist">Izvođač</div>
                    <span style="font-size: 12px; background: rgba(16, 185, 129, 0.2); color: var(--primary); padding: 4px 8px; border-radius: 6px;">TuneWise Engine Aktivno</span>
                </div>
            </div>
            <iframe id="musicEmbed" class="player-iframe" src="" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        let isListening = false;

        // 1. Slušanje iz okoline (Shazam funkcija)
        function toggleListening() {
            const btn = document.getElementById('listenBtn');
            const status = document.getElementById('statusText');

            if (!isListening) {
                isListening = true;
                btn.classList.add('listening');
                status.innerText = "Slušam glazbu u okolini...";

                setTimeout(() => {
                    isListening = false;
                    btn.classList.remove('listening');
                    status.innerText = "Pjesma prepoznata!";
                    showResult("Bohemian Rhapsody", "Queen", "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300", "https://www.youtube.com/embed/fJ9rUzIMcZQ?autoplay=1");
                }, 4000);
            } else {
                isListening = false;
                btn.classList.remove('listening');
                status.innerText = "Pretraživanje prekinuto.";
            }
        }

        // 2. Izravna veza s Micro WebLab AI poslužiteljem
        async function sendToMicroWebLab() {
            const query = document.getElementById('aiQuery').value.trim();
            const status = document.getElementById('statusText');

            if (!query) return alert("Unesite tekst ili glasovnu poruku.");

            status.innerText = "Komuniciram s Micro WebLab AI...";

            try {
                // Zamijeni ovaj URL točnom adresom svog Micro WebLab API-ja
                const response = await fetch('https://TVOJ-MICRO-WEBLAB-SERVER.com/api/v1/tune-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: query, mode: "music_search" })
                });

                const data = await response.json();
                showResult(data.song_title, data.artist_name, data.cover_image, data.embed_stream_url);
                status.innerText = "AI je učitao pjesmu!";
            } catch (error) {
                // Ako server još nije spojen, otvara pretragu
                searchMusic();
            }
        }

        // 3. Obična pretraga i prikaz u Playeru (Spotify funkcija)
        function searchMusic() {
            const query = document.getElementById('aiQuery').value.trim();
            if (!query) return;

            showResult(query, "Pronađeni Izvođač", "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300", `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}`);
            document.getElementById('statusText').innerText = "Prikazujem rezultate pretrage.";
        }

        function showResult(title, artist, img, embedUrl) {
            document.getElementById('playerCard').style.display = 'block';
            document.getElementById('trackTitle').innerText = title;
            document.getElementById('trackArtist').innerText = artist;
            document.getElementById('trackImg').src = img;
            document.getElementById('musicEmbed').src = embedUrl;
        }
    </script>
</body>
</html>
