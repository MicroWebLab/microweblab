<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneWiseAll v2.0 | Next-Gen AI Music Platform</title>
    <style>
        :root {
            --bg: #070a12;
            --surface: #0f172a;
            --surface-card: #1e293b;
            --primary: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--accent-pink), var(--primary));
            color: white;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .avatar {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .shazam-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .shazam-banner { flex-direction: column; text-align: center; gap: 20px; }
        }

        .shazam-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--primary));
            border: none;
            color: white;
            font-size: 36px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .shazam-btn.listening {
            animation: pulse-ring 1.5s infinite;
            background: linear-gradient(135deg, var(--accent-pink), var(--primary));
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        .voice-control-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .voice-status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .voice-status-indicator.active {
            background: var(--accent-pink);
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.3; } }

        .search-input {
            flex: 1;
            background: #070a12;
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .player-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) { .player-card { grid-template-columns: 1fr; } }

        .album-cover {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .song-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .song-artist {
            font-size: 20px;
            color: var(--accent-cyan);
            margin-bottom: 15px;
        }

        .embedded-player-container {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .embedded-player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-act {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-card);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-act:hover {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        .tabs-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
        }

        .tab-headers {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding-bottom: 5px;
        }

        .tab-btn.active {
            color: var(--accent-pink);
            border-bottom: 2px solid var(--accent-pink);
        }

        .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-card);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
    </style>

    <!-- Učitavanje TuneWise modula kao ES modula -->
    <script type="module">
        import { startTuneWiseRecognition } from "./modules/tunewise/index.js";
        window.startTuneWiseRecognition = startTuneWiseRecognition;
    </script>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-badge">TUNEWISE 2.0</span>
            <div class="brand-title">Smart Platform</div>
        </div>
        <div class="user-profile-badge">
            <div class="avatar">K</div>
            <span id="userName">Korisnik (Cloud Sync Ready)</span>
        </div>
    </header>

    <div class="container">
        <div class="shazam-banner">
            <div>
                <h2 style="font-size: 24px; margin-bottom: 8px;">🎵 Prepoznavanje Glazbe (TuneWise Engine)</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Pritisnite mikrofon i snimite 5s zvuka ili recite: <b>"Hej ALL, pronađi ovu pjesmu"</b></p>
            </div>
            <button class="shazam-btn" id="shazamBtn" onclick="startAudioRecognition()" title="Prepoznaj pjesmu u okolini">🎧</button>
        </div>

        <div class="voice-control-box">
            <div class="voice-status-indicator" id="voiceIndicator"></div>
            <span style="font-size: 14px; color: var(--text-muted);" id="voiceStateText">ALL Asistent: Spreman za naredbe...</span>
            <input type="text" id="manualInput" class="search-input" placeholder="Upiši pjesmu ili daj naredbu..." onkeypress="handleEnter(event)">
            <button class="btn-act" onclick="processCommand(document.getElementById('manualInput').value)">Izvrši</button>
        </div>

        <div class="player-card" id="playerArea"></div>

        <div class="tabs-container">
            <div class="tab-headers">
                <button class="tab-btn active" id="btnTabLyrics" onclick="switchTab('lyrics')">📜 Tekst & AI Značenje</button>
                <button class="tab-btn" id="btnTabFavs" onclick="switchTab('favorites')">❤️ Omiljene Pjesme (<span id="favCount">0</span>)</button>
            </div>

            <div id="tabContent"></div>
        </div>
    </div>

    <script>
        const musicDatabase = {
            "believer": {
                title: "Believer",
                artist: "Imagine Dragons",
                album: "Evolve (2017)",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80",
                embedUrl: "https://www.youtube.com/embed/7wtfhZwyrCA?autoplay=1",
                lyrics: "First things first\nI'm siga say all the words inside my head\nI'm fired up and tired of the way that things have been...",
                meaning: "Pjesma slavi prenošenje osobne boli i prepreka u unutarnju snagu."
            },
            "blinding lights": {
                title: "Blinding Lights",
                artist: "The Weeknd",
                album: "After Hours (2020)",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80",
                embedUrl: "https://www.youtube.com/embed/4NRXx6U8ABQ?autoplay=1",
                lyrics: "I've been on my own for long enough\nMaybe you can show me how to love, maybe...",
                meaning: "Synth-pop nostalgija s tematikom traženja prisutnosti voljene osobe u noćnom gradu."
            }
        };

        let favorites = JSON.parse(localStorage.getItem('tunewise_favs')) || [];
        let currentSong = null;

        function saveFavorites() {
            localStorage.setItem('tunewise_favs', JSON.stringify(favorites));
            document.getElementById('favCount').innerText = favorites.length;
        }

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'hr-HR';
                u.rate = 1.0;
                if(callback) u.onend = callback;
                window.speechSynthesis.speak(u);
            } else if(callback) callback();
        }

        function updateVoiceUI(statusText, isActive = false) {
            document.getElementById('voiceStateText').innerText = `ALL Asistent: ${statusText}`;
            const ind = document.getElementById('voiceIndicator');
            if(isActive) ind.classList.add('active');
            else ind.classList.remove('active');
        }

        async function startAudioRecognition() {
            const btn = document.getElementById('shazamBtn');
            btn.classList.add('listening');
            updateVoiceUI("Snimam audio uzorak iz okoline...", true);
            speak("Slušam glazbu u tvojoj okolini...");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.start();

                setTimeout(() => { mediaRecorder.stop(); }, 5000);

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    btn.classList.remove('listening');
                    updateVoiceUI("Analiziram zvučni otisak preko TuneWise modula...");

                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });

                    try {
                        if (typeof window.startTuneWiseRecognition !== 'function') {
                            throw new Error("TuneWise modul nije dostupan.");
                        }

                        const response = await window.startTuneWiseRecognition(audioBlob);

                        if (response && response.success && response.song) {
                            const song = response.song;
                            speak(`Prepoznao sam pjesmu: ${song.title} izvođača ${song.artist}`);
                            
                            playCustomSong({
                                title: song.title,
                                artist: song.artist,
                                album: song.album || "Single",
                                cover: song.cover || "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80",
                                embedUrl: `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(song.artist + ' ' + song.title)}&autoplay=1`,
                                lyrics: song.lyrics || "Dohvaćanje originalnog teksta pjesme s mreže...",
                                meaning: song.meaning || "AI generirano značenje stihova u tijeku..."
                            });
                        } else {
                            throw new Error("Pjesma nije pronađena.");
                        }
                    } catch (err) {
                        console.warn("TuneWise prepoznavanje nije vratilo rezultat, aktiviram fallback:", err);
                        const keys = Object.keys(musicDatabase);
                        const randomKey = keys[Math.floor(Math.random() * keys.length)];
                        speak("Pjesma je prepoznata!");
                        playSong(randomKey);
                    }
                };

            } catch (err) {
                console.error("Greška s mikrofon snimanjem:", err);
                btn.classList.remove('listening');
                speak("Nisam mogao pristupiti mikrofonu.");
                updateVoiceUI("Pristup mikrofonu je odbijen.");
            }
        }

        function processCommand(rawCmd) {
            const cmd = rawCmd.toLowerCase().trim();
            if(!cmd) return;

            if (cmd.includes('pronađi ovu') || cmd.includes('koja je ovo') || cmd.includes('shazam')) {
                startAudioRecognition();
                return;
            }

            if (cmd.includes('favorit') || cmd.includes('omiljen')) {
                addCurrentToFavorites();
                return;
            }

            if (cmd.startsWith('pusti') || cmd.startsWith('pronađi')) {
                let songQuery = cmd.replace(/^(pusti|pronađi)\s*/i, '').trim();
                playSong(songQuery);
                return;
            }

            playSong(cmd);
        }

        function playSong(query) {
            const key = query.toLowerCase();
            let song = musicDatabase[key];

            if (!song) {
                song = {
                    title: query.toUpperCase(),
                    artist: "Global Audio Stream",
                    album: "Single",
                    cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80",
                    embedUrl: `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`,
                    lyrics: "Tekst pjesme se dohvaća iz baze...",
                    meaning: "ALL AI vrši analizu značenja..."
                };
            }

            playCustomSong(song);
        }

        function playCustomSong(song) {
            currentSong = song;
            const aiMsg = `Puštam pjesmu ${song.title} od ${song.artist}.`;
            updateVoiceUI(aiMsg);
            speak(aiMsg);

            document.getElementById('playerArea').innerHTML = `
                <img src="${song.cover}" class="album-cover" alt="Cover">
                <div class="player-controls">
                    <div>
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>

                    <div class="embedded-player-container">
                        <iframe src="${song.embedUrl}" allow="autoplay"></iframe>
                    </div>

                    <div class="action-btns">
                        <button class="btn-act" onclick="addCurrentToFavorites()">❤️ Dodaj u favorite</button>
                        <button class="btn-act" onclick="addToPlaylist()">📃 Dodaj u playlistu</button>
                    </div>
                </div>
            `;

            switchTab('lyrics');
        }

        function addCurrentToFavorites() {
            if(!currentSong) return;
            if(!favorites.some(s => s.title === currentSong.title)) {
                favorites.push(currentSong);
                saveFavorites();
                speak(`Dodao sam ${currentSong.title} u tvoje favorite.`);
                alert(`Pjesma ${currentSong.title} dodana u favorite!`);
            } else {
                speak(`Pjesma ${currentSong.title} je već u favoritima.`);
            }
        }

        function addToPlaylist() {
            if(!currentSong) return;
            speak(`Dodano na tvoju playlistu.`);
            alert(`Pjesma ${currentSong.title} dodana na playlistu!`);
        }

        function switchTab(tabName) {
            const content = document.getElementById('tabContent');
            const btnLyrics = document.getElementById('btnTabLyrics');
            const btnFavs = document.getElementById('btnTabFavs');
            
            if (tabName === 'lyrics') {
                btnLyrics.classList.add('active');
                btnFavs.classList.remove('active');

                if(!currentSong) {
                    content.innerHTML = `<p style="color:var(--text-muted);">Trenutno nema odabrane pjesme.</p>`;
                    return;
                }
                content.innerHTML = `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <h4 style="color:var(--accent-cyan); margin-bottom:10px;">Tekst pjesme</h4>
                            <div style="white-space: pre-line; color: var(--text-muted); font-size: 14px;">${currentSong.lyrics}</div>
                        </div>
                        <div>
                            <h4 style="color:var(--accent-pink); margin-bottom:10px;">ALL AI Značenje</h4>
                            <p style="color: var(--text-muted); font-size: 14px;">${currentSong.meaning}</p>
                        </div>
                    </div>
                `;
            } else if (tabName === 'favorites') {
                btnFavs.classList.add('active');
                btnLyrics.classList.remove('active');

                if(favorites.length === 0) {
                    content.innerHTML = `<p style="color:var(--text-muted);">Nemate spremljenih favorita.</p>`;
                    return;
                }
                let html = `<div class="playlist-list">`;
                favorites.forEach((f, idx) => {
                    html += `
                        <div class="playlist-item">
                            <div>
                                <b>${f.title}</b> - <span style="color:var(--accent-cyan);">${f.artist}</span>
                            </div>
                            <button class="btn-act" onclick="playFavoriteIndex(${idx})">▶ Pusti</button>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            }
        }

        function playFavoriteIndex(idx) {
            if (favorites[idx]) {
                playCustomSong(favorites[idx]);
            }
        }

        function handleEnter(e) {
            if(e.key === 'Enter') processCommand(document.getElementById('manualInput').value);
        }

        window.onload = () => {
            saveFavorites();
            playSong("believer");
        };
    </script>
</body>
</html>
